<script type="application/json" id="corpus">{"meta":{"title":"BioLingua Daily","subtitle":"生物医药英语精读 · 每日更新","owner":"Yu","tz":"Europe/Berlin"},"roadmap":{"weekly":[{"day":"周一","theme":"全链条研发 R&D Value Chain"},{"day":"周二","theme":"前沿技术风向 Modality Watch"},{"day":"周三","theme":"法规与合规 Regulatory & Compliance"},{"day":"周四","theme":"Glocal 中国全球化"},{"day":"周五","theme":"医保与准入 Access & Reimbursement"},{"day":"周六","theme":"商业模式转变 Business Model Shift"},{"day":"周日","theme":"周复盘 Weekly Review"}]},"days":[{"date":"2026-08-20","weekday":"周四","theme":"Glocal 中国全球化","headline":"中国资产正在为跨国药企的全球试验和产品线持续「供货」，而美国这一端的规则制定者（FDA 局长人选）与付费规则（IRA 谈判遭司法挑战）同时进入不确定期——供给侧确定性上升、需求侧确定性下降，是今天这五条共同的底色。","news":[{"id":"n1","title":"Biokin bispecific ADC iza-bren hits goal in lung cancer trial, boosting case for BMS' global test","source":"Fierce Pharma","url":"https://www.fiercepharma.com/pharma/biokin-bispecific-adc-iza-bren-hits-goal-lung-cancer-trial-boosting-case-bms-global-test","tag":"Glocal 中国全球化","summary":"百利天恒的 EGFRxHER3 双抗 ADC iza-bren 在中国三期 Panku-Lung01 达到主要终点：EGFR-TKI 经治的晚期非鳞 NSCLC 显著延长无进展生存，总生存亦见正向趋势。该药曾以 8 亿美元首付、总额至多 84 亿美元授权给 BMS，中国数据正在为其全球三期背书。","terms":[{"t":"hit the (primary) goal / meet the primary endpoint","zh":"达到主要终点","note":"新闻标题偏爱短词 hit goal，正式稿件写 met its primary endpoint。写作时用后者，读新闻时认前者。"},{"t":"bispecific ADC","zh":"双特异性抗体偶联药物","note":"bispecific 指一个抗体同时结合两个靶点（此处 EGFR 与 HER3）；ADC = antibody-drug conjugate，抗体做导航、毒素做弹头。"},{"t":"boost the case for","zh":"为……增添了说服力／让……更站得住脚","note":"make the case for 是「论证支持」，boost the case for 是在已有论证上再加砝码，常用于数据支持某项决策。"},{"t":"progression-free survival (PFS)","zh":"无进展生存期","note":"肿瘤试验最常见的替代终点。搭配用 a significant PFS benefit、improve PFS，不说 increase PFS。"},{"t":"a positive trend toward an improvement","zh":"呈现向好趋势（但尚未达统计学显著）","note":"行业里最重要的一句「客套话」：说明数据方向对但没打赢统计。看到 trend 二字就要意识到还没有 statistically significant。"},{"t":"post-TKI setting","zh":"TKI 治疗失败后（的治疗场景）","note":"setting 在临床语境里指「治疗场景／线数」，如 first-line setting、adjuvant setting，不是「设置」。"},{"t":"upfront payment","zh":"首付款","note":"授权交易三段式：upfront（首付）+ milestones（里程碑）+ royalties（销售分成）。媒体报的「总额」几乎都是三者相加的理论上限。"},{"t":"read through to","zh":"（一个数据）可外推／可参照到（另一试验）","note":"投资人常用：Does the China data read through to the global trial? 意即中国人群结果能否预示全球人群结果。"}],"expert":"同行看到这条会立刻追问三件事。第一，PFS 赢了，但 OS 只写「正向趋势」——ADC 在 EGFR-TKI 经治人群里的获益能否转化为生存获益，是 BMS 全球三期 Izabright-Lung01 真正的风险点。第二，对照臂是什么？在中国，TKI 失败后的标准治疗多为含铂化疗，而全球多地已有 Dato-DXd、amivantamab 等新选择，对照臂强度不同会显著影响结果的可外推性。第三，安全性尤其是间质性肺病（ILD）发生率——这是 ADC 在肺癌人群里最常见的翻车点，本次新闻稿并未披露。三个问题不解决，中国数据只能算是「降低了风险」，还不是「证明了全球可行」。","subtext":"没说的部分比说了的更值得读：没有 HR 数值，没有 OS 成熟度，没有 ILD 数据，也没说全球试验是否会因此调整。可见这次披露的主要功能是资本市场沟通与全球试验背书，而非完整的科学交底。第二层含义在于交易结构——8 亿美元首付换来的是「中国先跑、全球后验」的开发范式：中国以较低成本、较快入组完成概念验证，跨国药企承担全球确证性试验的费用与风险。对中国市场的映射是，这类资产的国内定价会被境外授权金额反向锚定，「在中国便宜、在海外贵」的双轨定价越来越难自圆其说。"},{"id":"n2","title":"Sandoz inks $322M Henlius deal for rights to as many as 10 biosimilars","source":"BioSpace","url":"https://www.biospace.com/drug-delivery/sandoz-inks-322m-henlius-deal-for-rights-to-as-many-as-10-biosimilars","tag":"商业模式","summary":"山德士与上海复宏汉霖签署总额最高 3.22 亿美元的协议，先期与近期付款约 1.005 亿美元，换取最多 10 个生物类似药的中国以外权益。首批资产包括 Repatha、Erbitux、Benlysta 的类似药及重组人透明质酸酶，由复宏汉霖负责开发与生产。","terms":[{"t":"ink a deal","zh":"签下协议","note":"新闻体高频动词，等于 sign。同族还有 pen a deal、strike a deal、seal a deal，正式文书里仍用 enter into an agreement。"},{"t":"biosimilar","zh":"生物类似药","note":"不能说 generic biologic。生物药无法完全复制，只能做到 highly similar，因此监管路径叫 biosimilarity 而非 bioequivalence。"},{"t":"ex-China rights","zh":"中国以外的权益","note":"ex- 在交易语境是「除……之外」，如 ex-US、ex-Japan。别读成「前任」。这是 license-out 中最常见的地域切分方式。"},{"t":"milestone payments","zh":"里程碑付款","note":"分为 development / regulatory / commercial milestones。报道里的「总额」通常把三类全部按最好情况相加。"},{"t":"as many as 10 biosimilars","zh":"多达 10 个生物类似药","note":"as many as 强调数量之多，暗示是上限而非确定数。中文写「多达」比「10 个」更忠实。"},{"t":"reference product","zh":"原研参照药","note":"生物类似药必须指定一个 reference product 做头对头比较；美国叫 reference product，欧盟叫 reference medicinal product。"},{"t":"loss of exclusivity (LOE)","zh":"独占期到期","note":"行业里说「某药 LOE 了」即专利／数据保护到期、类似药可进场，是所有 biosimilar 交易的时间锚点。"},{"t":"GMP-certified capacity","zh":"通过 GMP 认证的产能","note":"capacity 以升（liters）计。谈生物药产能时说 84,000-liter capacity，量词用 -liter 连字符作定语。"}],"expert":"熟悉这块的人会问：山德士买的是分子，还是产能？以 1 亿美元出头拿下多达 10 个资产的境外权益，几乎是「按管线打包批发」，说明稀缺的不是靶点选择——Repatha、Benlysta 的 LOE 时间点全行业都看得见——而是能在 84,000 升规模上稳定、低成本、且带美国 GMP 认证交付的产线。第二个问题是时间：首批三个资产分处临床、技术开发与早期阶段，现金流要到 2030 年前后才可能出现。第三是地缘：ex-China 权益含美国，而生物药供应链本土化压力正在上升，能否顺利执行取决于政治环境而非科学。","subtext":"「没说的部分」值得注意：没有披露分成比例（royalty rate），没有说明是否含独家生产权，也没有任何一方的高管表态——一份连引语都没有的新闻稿，通常意味着双方都不想把它讲成战略级事件。第二层含义是中国生物制药的角色正在分层：创新药走 license-out 讲估值故事，生物类似药走「全球代工＋权益分成」，后者不性感但现金流确定、可复制、抗周期。对中国市场的映射是，国内生物类似药已被集采压到微利，承接跨国仿创企业的产能需求几乎是唯一能维持毛利的路径；这不是进攻，是转移。"},{"id":"n3","title":"Trump taps White House aide Heidi Overton as nominee for next FDA commissioner","source":"Fierce Biotech","url":"https://www.fiercebiotech.com/biotech/trump-taps-white-house-aide-overton-next-fda-commissioner","tag":"法规与合规","summary":"特朗普提名白宫国内政策委员会副主任 Heidi Overton 出任下一任 FDA 局长。她拥有医学博士与约翰霍普金斯临床研究博士学位，曾主持 America First Policy Institute 的健康美国中心。FDA 自 Makary 今年 5 月离任后由 Kyle Diamantas 代理，提名须经参议院 HELP 委员会确认。","terms":[{"t":"tap someone as / for","zh":"点将、选定某人担任","note":"比 appoint 口语、比 name 生动，专用于高层人事新闻。注意只用于「选中」，正式任命仍需 confirm。"},{"t":"nominee vs. appointee","zh":"被提名人 vs. 已获任命者","note":"FDA 局长属须经参议院确认的职位，因此在确认前只能称 nominee；写成 the new commissioner 是事实性错误。"},{"t":"Senate HELP Committee","zh":"参议院卫生、教育、劳工与养老金委员会","note":"HELP = Health, Education, Labor and Pensions。FDA、NIH、CDC 的人事与监督都要过这个委员会。"},{"t":"confirmation hearing","zh":"（人事）确认听证会","note":"流程链条：nomination → confirmation hearing → committee vote → floor vote。四步缺一不可。"},{"t":"lame duck","zh":"跛脚鸭；任期将尽、影响力衰减者","note":"指初选落败或不再连任但仍在位的官员。用于判断其政治资本还剩多少，是解读听证难度的关键线索。"},{"t":"interim / acting leader","zh":"代理负责人","note":"acting 强调「代行职权」，interim 强调「过渡期」。机构长期由 acting 主持，常被解读为政策不确定。"},{"t":"depart / step down","zh":"离任、辞职","note":"媒体用中性的 depart 或 step down；被免职才用 ousted、forced out。选词本身就是立场信号。"},{"t":"chief policy officer","zh":"首席政策官","note":"智库与倡导机构的常见头衔，负责对外政策主张而非内部运营，与企业的 CPO（Chief Product Officer）不同。"}],"expert":"业内真正关心的不是履历，而是三个问题。第一，她对加速批准（accelerated approval）与真实世界证据的立场是什么？前任 Makary 任内推动了若干审评路径改革，继任者是延续还是回摆，直接决定罕见病与肿瘤领域的申报策略。第二，FDA 的人手与审评时限——机构在经历减员与代理领导期后，PDUFA 时限的兑现率是所有申办方今年最实际的焦虑。第三，确认时间表：主持 HELP 委员会的 Cassidy 已在初选中落败，是典型的 lame duck，这既可能让听证走得更快（无连任包袱），也可能让程序更漂移。在确认落定之前，FDA 的政策方向仍属未定，任何依赖「监管友好度」的估值假设都应打折。","subtext":"白宫表态里没有一个字提到审评标准、药价或与 CMS 的协同，通篇是忠诚度与国家竞争力的语言——这本身就是信号：首要考量是政策执行的一致性，而非监管技术路线。第二层含义是，局长空缺三个月由代理主持，说明该职位在本届政府的优先级并不靠前，机构自主性可能被政策中枢进一步吸收。对中国市场的映射有两层：一是中国资产赴美申报的不确定性随审评资源波动放大，license-out 里的监管里程碑条款风险上升；二是若 FDA 更强调本土创新领导地位，对仅来自中国人群的数据接受度可能趋紧。"},{"id":"n4","title":"Teva scores rare partial win in CMS price negotiation appeal","source":"Fierce Pharma","url":"https://www.fiercepharma.com/pharma/teva-scores-rare-partial-court-win-vs-cms-price-negotiations","tag":"医保与准入","summary":"华盛顿特区联邦上诉法院将 Teva 对 CMS「真实上市销售」（bona fide marketing）标准的质疑发回地区法院重审，法官 J. Michelle Childs 指出下级法院从未审查该标准是否符合 IRA；但法院同时维持 CMS 把 Austedo 与 Austedo XR 认定为同一药品、一并纳入谈判的做法。","terms":[{"t":"remand (a case) to the district court","zh":"将案件发回地区法院（重审）","note":"remand ≠ 判赢。它只是把问题退回下级法院先行审理，实体结果仍未定，媒体常把它写成 win，要留心。"},{"t":"bona fide marketing","zh":"真实（实质性）上市销售","note":"bona fide 是拉丁语「善意、真实的」。此处指仿制药必须真正在市场上销售，而非象征性上市，原研药才能退出谈判名单。"},{"t":"in the first instance","zh":"由（下级法院）先行处理","note":"法律固定表达，意为「一审层面先解决」，不是「首先」。判决书原文即用此语把问题交还地区法院。"},{"t":"uphold vs. overturn","zh":"维持（原判／行政决定）vs. 推翻","note":"还有 vacate（撤销）、affirm（确认）。判决报道里这几个动词决定了胜负方向，不能混用。"},{"t":"score a rare win","zh":"罕见地赢下一局","note":"score 在此是「拿下、争得」，比 win 更强调来之不易。rare 一词暗示制药业在 IRA 诉讼中此前几乎全败。"},{"t":"Drug Price Negotiation Program","zh":"（IRA 下的）药价谈判计划","note":"官方名称是 Medicare Drug Price Negotiation Program，媒体简写为 price negotiations。避免译成「集采」——机制完全不同。"},{"t":"treated as a single drug","zh":"被认定为同一药品（合并计算）","note":"IRA 按「单一活性成分」归并剂型，因此缓释版 XR 不能单独豁免。这是本案 Teva 输掉的部分。"},{"t":"generic entry","zh":"仿制药上市（进入市场）","note":"搭配 delay generic entry、block generic entry。IRA 的设计逻辑是：一旦有真实仿制竞争，就无需政府谈判。"}],"expert":"熟悉准入的人会追问：这次「部分胜诉」到底改变了什么？实质上只改变了一件事——CMS 用什么标准判断仿制药是否「真实在售」，现在要接受司法审查。真正的追问有三层。第一，如果 bona fide marketing 标准被判过宽或过窄，会不会诱发新的博弈：原研方有动机促成一个「象征性仿制上市」以脱离谈判名单，而 CMS 的标准正是为了堵这个口子。第二，Austedo 与 Austedo XR 被合并认定，意味着「改剂型延长生命周期」这条经典策略在 IRA 下基本失效，产品生命周期管理的算法要重写。第三，这类判决对后续谈判周期的名单是否有溯及力，目前没有答案。整体看，行业赢的是程序，不是规则。","subtext":"措辞值得注意：法院强调把问题「留给下级法院先行考虑」，等于回避了对 IRA 合宪性的实体表态。迄今制药业针对 IRA 的宪法层面挑战几乎全部失败，本案拿到的只是行政法层面的技术性回旋，说明司法路径基本走到尽头，博弈重心正移回国会与规则制定端。第二层含义是，企业越来越倾向挑战「定义」而非「制度」——谁算一个药、谁算真实竞争，定义之争的经济价值可能高于制度之争。对中国的映射很直接：医保谈判与集采同样以剂型归并和是否存在实质竞争为核心判定，但缺乏对等的司法救济通道，这也解释了为何中国药企的政府事务权重远高于法务。"},{"id":"n5","title":"Merck, Moderna's personalized cancer vaccine slows recurrence in phase 3, setting up approval push","source":"Fierce Biotech","url":"https://www.fiercebiotech.com/biotech/merck-and-modernas-personalized-cancer-vaccine-slows-recurrence-ph-3-trial","tag":"前沿技术","summary":"默沙东与 Moderna 的个体化 mRNA 肿瘤疫苗 intismeran autogene（mRNA-4157／V940）在三期 INTerpath-001 中联合 Keytruda，使 1137 例完全切除的 IIB–IV 期黑色素瘤患者无复发生存显著改善，无远处转移生存亦达统计学显著，未见新的安全性信号，双方将与监管机构商谈加速批准。","terms":[{"t":"recurrence-free survival (RFS)","zh":"无复发生存期","note":"用于已完全切除、体内无可测量病灶的辅助治疗试验；有病灶时才用 PFS。两者不可互换。"},{"t":"individualized neoantigen therapy (INT)","zh":"个体化新抗原疗法","note":"先测患者肿瘤突变，再定制编码新抗原的 mRNA。行业正以 INT 取代「癌症疫苗」一词，因为它并非预防性疫苗。"},{"t":"completely resected","zh":"完全（根治性）切除","note":"resect 是外科专用动词，名词 resection。completely resected 是辅助治疗试验的入组前提。"},{"t":"adjuvant setting","zh":"辅助治疗阶段（术后）","note":"adjuvant 指术后清扫微小残留；neoadjuvant 指术前缩瘤。两个词只差一个前缀，临床含义完全不同。"},{"t":"accelerated approval","zh":"加速批准","note":"基于替代终点先批、后补确证性试验。与 priority review（缩短审评时钟）、breakthrough designation（沟通加密）是三件不同的事。"},{"t":"set up an approval push","zh":"为申报上市铺路／造势","note":"push 作名词指「一波集中推进」。类似说法 pave the way for a filing、tee up a submission。"},{"t":"no new safety signals","zh":"未观察到新的安全性信号","note":"行业标准表述。注意它只说「没有新的」，不等于「没有毒性」——已知毒性仍然存在。"},{"t":"distant metastasis-free survival (DMFS)","zh":"无远处转移生存期","note":"黑色素瘤等实体瘤辅助治疗的关键次要终点，比 RFS 更贴近真正的临床获益。"}],"expert":"行业里会追问三点。第一，绝对获益有多大？新闻稿只说「统计学显著且具临床意义」，未披露风险比与事件数，而在 Keytruda 单药已经把复发率压得很低的人群里，增量空间本就有限，没有 HR 就无法判断值不值这套定制化成本。第二，生产与周转（turnaround time）能否规模化——每位患者一支疫苗，测序、设计、合成、放行的周期若超过术后免疫治疗窗口，再好的数据也难以落地。第三，加速批准的替代终点问题：RFS 是否被监管方接受为可支持完全批准的终点，OS 数据尚未成熟，这决定了它是先获批再补数据，还是要等到本世纪 20 年代末。此外，定价与报销尚无任何口径。","subtext":"没给出的恰恰是最贵的信息：没有 HR、没有事件数、没有随访时长、没有制备周期、没有价格区间。这种「先发结论、后发数据」的节奏，通常服务于监管沟通与预期管理。第二层含义是范式转移——若个体化 mRNA 走通，肿瘤药的竞争要素会从「分子好不好」转向「测序—设计—生产—放行的闭环有多快」，制药公司实质上变成高度定制的生产与物流公司，对商业模式的冲击远大于对科学的冲击。对中国的映射是双面的：测序成本与入组速度是结构性优势，单位成本可能更低；但现行医保支付体系几乎无法容纳「一人一药」的定价逻辑，支付端才是真正的瓶颈。"}],"deepdive":{"title":"今日深挖 · Glocal 中国全球化","body":"把今天的 n1 与 n2 并排看，会发现中国生物医药出海已经分裂成两条完全不同的路，它们的语言、估值逻辑与监管风险都不一样。\n\n第一条是创新药的 license-out：upfront + milestones + royalties 三段式。媒体口径的「总额 84 亿美元」几乎永远是把开发、监管、商业三类里程碑按最理想情况相加的理论上限，真正落袋的往往只有首付那一笔。读这类新闻的第一个动作，就是把 upfront 从 total deal value 里单独摘出来。第二条是生物类似药与产能的输出，像山德士与复宏汉霖，用一亿美元出头拿下十个资产的 ex-China 权益。它不讲估值故事，讲的是 LOE 时间表和每升产能的成本——本质上是把中国的制造效率卖给全球仿创企业。\n\n决定这两条路能走多远的，是 FDA 与 NMPA 的差异。NMPA 自 2017 年加入 ICH 后技术要求已高度趋同，但角色不同：它在审评之外还深度嵌入产业政策，审评加速常与鼓励国产创新绑定；FDA 名义上只对科学与公共健康负责，却因局长由总统提名、参议院确认（正如今天 Overton 的提名），承受更直接的政治周期波动。对中国申办方最要命的差异是人群外推：NMPA 接受境外数据需做桥接研究，而 FDA 对「仅来自单一国家、且该国标准治疗与美国不同」的数据一向审慎——2022 年信迪利单抗的 ODAC 会议就是标准案例，专家组质疑的核心是对照臂与人群代表性，而非疗效本身。这也是 n1 里 BMS 必须另做全球三期的原因。\n\n所以 Glocal 的真正含义不是「在中国做全球生意」，而是承认存在两套证据标准：中国数据用来降低风险和定价，全球数据用来换取批准。","terms":[{"t":"total deal value vs. upfront","zh":"交易总额 vs. 首付款","note":"biobucks 是行业对「理论总额」的戏称。分析师习惯只看 upfront + near-term milestones，因为其余部分兑现概率通常低于三成。"},{"t":"bridging study","zh":"桥接研究","note":"为把境外数据外推到本国人群而做的补充试验，通常验证 PK 与剂量。NMPA 接受境外数据的常规前提。"},{"t":"extrapolation to the target population","zh":"向目标人群外推","note":"监管审评核心概念。争点通常有三：种族／代谢差异、对照臂是否等同于当地标准治疗、以及临床实践模式差异。"},{"t":"standard of care (SoC)","zh":"标准治疗","note":"对照臂必须是当地 SoC。中美 SoC 不同，正是单一国家数据难以被对方监管机构接受的根本原因。"},{"t":"ODAC (Oncology Drugs Advisory Committee)","zh":"（FDA）肿瘤药物咨询委员会","note":"非约束性专家投票，但结论对 FDA 决定影响极大。中国药企赴美申报时最需要预演的一关。"}]},"ted":{"speaker":"Siddhartha Mukherjee","title":"Soon we'll cure diseases with a cell, not a pill","event":"TED2015","duration":"约 20 分钟","embed":"https://embed.ted.com/talks/siddhartha_mukherjee_soon_we_ll_cure_diseases_with_a_cell_not_a_pill","page":"https://www.ted.com/talks/siddhartha_mukherjee_soon_we_ll_cure_diseases_with_a_cell_not_a_pill","transcript":"https://www.ted.com/talks/siddhartha_mukherjee_soon_we_ll_cure_diseases_with_a_cell_not_a_pill/transcript","why":"今天 n5 讲的是「一人一药」的个体化细胞与 mRNA 疗法，而 Mukherjee 这场演讲正是这套范式最早、也最有文学性的公开论证：他把「用药片对抗疾病」的旧模型，换成「用细胞重建组织」的新模型。语言上，他是普利策奖得主，句子有清晰的三段式推进、大量并列结构和精准的比喻，是练习学术演讲节奏与让步表达的极好材料；认知上，它能帮你补上「为什么整个行业要从小分子转向细胞与基因」的底层叙事——这是你读 ADC、CAR-T、INT 类新闻时始终需要的背景。","phrases":[{"t":"a paradigm shift","zh":"范式转移","note":"指底层认知框架的整体更换，而非渐进改良。学术与商业演讲通用，滥用会显空洞，务必接具体对照。","ex":"Individualized neoantigen therapy represents a paradigm shift from treating a tumor type to treating a single patient's tumor."},{"t":"to put it another way","zh":"换句话说","note":"重述过渡语，比 in other words 更口语、更有节奏感。适合在口语考试里为复杂论点做二次解释。","ex":"The upfront payment is only a fraction of the headline number; to put it another way, most of that $8.4 billion may never be paid."},{"t":"It turns out that ...","zh":"事实证明／结果发现……","note":"英语科普演讲的标志性句式，用来引出反直觉的发现。比 We found that 更自然，也更能制造悬念。","ex":"It turns out that manufacturing turnaround time, not efficacy, is the real bottleneck for personalized cancer vaccines."},{"t":"to be fair / to be sure","zh":"平心而论／诚然","note":"学术让步语。先承认对方合理之处，再转折推进，是雅思写作与口语拿高分的核心策略之一。","ex":"To be sure, the phase 3 data are encouraging; the absence of a hazard ratio, however, makes the magnitude of benefit impossible to judge."},{"t":"at the heart of","zh":"……的核心在于","note":"比 the most important part of 更凝练。搭配名词，不接从句：at the heart of the problem is …（注意倒装）。","ex":"At the heart of the Glocal model lies a simple asymmetry: China generates the evidence, the West grants the approval."},{"t":"far from being ..., it is actually ...","zh":"它非但不是……，实际上是……","note":"强对比修辞结构，用于纠正常见误解，句首前置能显著提升论述的力度。","ex":"Far from being a full victory, the ruling merely returns one narrow question to the lower court."},{"t":"in a fundamental sense","zh":"从根本意义上说","note":"比 basically 正式得多，用于把讨论从技术细节拉回原则层面。写作中放在句首并用逗号隔开。","ex":"In a fundamental sense, a cell therapy is not a drug at all; it is a manufacturing process delivered to one person."},{"t":"we have come to think of X as Y","zh":"我们已经习惯于把 X 理解为 Y","note":"用于铺陈「旧共识」，随后再推翻它。come to 表示认知的渐变过程，是很自然的高分表达。","ex":"We have come to think of medicine as something you swallow, rather than something that is grown."},{"t":"a case in point","zh":"一个恰当的例证","note":"举例过渡语，独立成句或作同位语。比 for example 更书面，也更能显示例子与论点的紧密关系。","ex":"The 2022 ODAC review of sintilimab is a case in point: the data were strong, the trial population was not representative."},{"t":"the sheer scale / complexity of","zh":"……之庞大／复杂本身","note":"sheer 用来强调程度令人震撼，只修饰抽象名词，不能说 sheer good。演讲中制造压迫感的常用词。","ex":"The sheer complexity of making a bespoke vaccine for every patient explains why so few companies have tried."},{"t":"beg the question","zh":"引出了一个问题（口语用法）","note":"严格逻辑学中它指「循环论证」，但当代口语与媒体已普遍用作 raise the question。写作时建议用 raise 更安全。","ex":"The deal begs the question of whether Sandoz was buying molecules or simply buying capacity."},{"t":"in the long run","zh":"从长远看","note":"固定搭配，注意是 run 不是 term（in the long term 也对，但 run 更口语）。对应的短期表达是 in the near term。","ex":"In the long run, payment systems, not science, will decide whether one-patient-one-drug therapies survive."}],"shadow":{"segment":"建议选取开场后约 2:00–6:00 的一段。这一段 Mukherjee 在铺陈「药片模型」的历史由来，句子完整、语速中等、专业术语密度低而逻辑连接词密度高，最适合用来练习意群停顿与重音落点；后半段的比喻与排比更适合等你熟悉节奏之后再攻。","how":"四步法：①盲听两遍，只抓主张与转折，不看文本，用中文写下三句话的大意；②对照 transcript 精读，把所有连接词与让步语（but、although、to be fair、it turns out）标出来，确认自己第一遍听漏了哪一处逻辑；③逐句跟读，重点不是发音准确，而是复制他的停顿位置和重读音节，一句话录一遍与原声对比；④脱稿复述，用自己的话把这四分钟讲成 90 秒，并强制使用今天 phrases 里的至少三个表达。全程约 35 分钟。"}}}]}</script>
<script>
(function(){
  var DATA = {};
  try { DATA = JSON.parse(document.getElementById('corpus').textContent); }
  catch(e){ DATA = {days:[]}; }
  var days = (DATA.days||[]);
  var sel = document.getElementById('daySel');

  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function termHTML(t){
    return '<div class="term"><span class="t">'+esc(t.t)+'</span> · <span class="zh">'+esc(t.zh)+'</span>'+
      (t.note?'<span class="note">'+esc(t.note)+'</span>':'')+'</div>';
  }

  function renderNews(list){
    var box = document.getElementById('newsList');
    box.innerHTML = (list||[]).map(function(n){
      var h = '<article class="news" id="'+esc(n.id)+'">';
      h += '<div class="nhead"><span class="badge">'+esc(n.tag)+'</span>';
      h += '<div class="ntitle"><a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a>';
      h += '<div class="src">'+esc(n.source)+'</div></div></div>';
      h += '<div class="summary">'+esc(n.summary)+'</div>';
      if(n.terms && n.terms.length){
        h += '<details class="foldall" open><summary>词汇与表达（'+n.terms.length+'）</summary>';
        h += '<div class="terms">'+n.terms.map(termHTML).join('')+'</div></details>';
      }
      if(n.expert){ h += '<div class="block"><div class="lab">同行专家怎么看</div><p>'+esc(n.expert)+'</p></div>'; }
      if(n.subtext){ h += '<div class="block"><div class="lab">弦外之音</div><p>'+esc(n.subtext)+'</p></div>'; }
      h += '</article>';
      return h;
    }).join('');
  }

  function renderDD(dd){
    var box = document.getElementById('ddCard');
    if(!dd){ box.innerHTML=''; return; }
    var body = String(dd.body||'').split(/\n+/).filter(Boolean)
      .map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
    var h = '<h3>'+esc(dd.title)+'</h3><div class="body">'+body+'</div>';
    if(dd.terms && dd.terms.length){ h += '<div class="terms">'+dd.terms.map(termHTML).join('')+'</div>'; }
    box.innerHTML = h;
  }

  function renderTed(t){
    var box = document.getElementById('tedCard');
    if(!t){ box.innerHTML=''; return; }
    var h = '<div class="tedmeta">'+esc(t.speaker)+' · '+esc(t.event||'')+' · '+esc(t.duration||'')+'</div>';
    h += '<div class="tedtitle">'+esc(t.title)+'</div>';
    if(t.embed){
      h += '<div class="ratio"><iframe src="'+esc(t.embed)+'" title="'+esc(t.title)+
           '" allow="autoplay; fullscreen; encrypted-media" allowfullscreen loading="lazy"></iframe></div>';
    }
    h += '<div class="tedmeta">';
    if(t.page) h += '<a href="'+esc(t.page)+'" target="_blank" rel="noopener">TED 页面</a> · ';
    if(t.transcript) h += '<a href="'+esc(t.transcript)+'" target="_blank" rel="noopener">讲稿 Transcript</a>';
    h += '</div>';
    if(t.why){ h += '<div class="block"><div class="lab">为什么选它</div><p>'+esc(t.why)+'</p></div>'; }
    if(t.phrases && t.phrases.length){
      h += '<div class="block"><div class="lab">地道表达（'+t.phrases.length+'）</div>';
      h += t.phrases.map(function(p){
        return '<div class="phr"><span class="t" style="font-weight:650;color:var(--acc2)">'+esc(p.t)+
          '</span> · '+esc(p.zh)+
          (p.note?'<span class="note" style="display:block;color:var(--dim);font-size:13px;margin-top:3px">'+esc(p.note)+'</span>':'')+
          (p.ex?'<span class="ex">'+esc(p.ex)+'</span>':'')+'</div>';
      }).join('')+'</div>';
    }
    if(t.shadow){
      h += '<div class="shadow"><div class="lab" style="color:var(--warn);font-weight:700;font-size:12.5px">跟读任务</div>';
      h += '<p style="margin:4px 0">'+esc(t.shadow.segment)+'</p>';
      h += '<p style="margin:4px 0">'+esc(t.shadow.how)+'</p></div>';
    }
    box.innerHTML = h;
  }

  function render(i){
    var d = days[i];
    if(!d) return;
    document.getElementById('dMeta').textContent = d.date + ' · ' + (d.weekday||'');
    document.getElementById('dTheme').textContent = d.theme || '';
    document.getElementById('dHeadline').textContent = d.headline || '';
    renderNews(d.news);
    renderDD(d.deepdive);
    renderTed(d.ted);
  }

  sel.innerHTML = days.map(function(d,i){
    return '<option value="'+i+'">'+esc(d.date)+' · '+esc(d.weekday||'')+' · '+esc(d.theme||'')+'</option>';
  }).join('');
  sel.addEventListener('change', function(){ render(parseInt(sel.value,10)||0); window.scrollTo(0,0); });

  if(DATA.meta && DATA.meta.subtitle){ document.getElementById('subtitle').textContent = DATA.meta.subtitle; }
  document.getElementById('dayCount').textContent = '共 ' + days.length + ' 天';
  render(0);
})();
</script>
</body>
</html>
